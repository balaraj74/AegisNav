name: ros-build-test

# Builds the ROS 2 workspace and runs its package tests in the ros:jazzy image (Ubuntu 24.04).
# The full Gazebo/Nav2 missions need a GPU-less but heavy image and are run with tools/run_batch.sh,
# not here; this job catches message-generation, packaging and adapter-test regressions.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  colcon:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-pytest python3-yaml \
            ros-jazzy-nav2-msgs ros-jazzy-tf2-ros-py ros-jazzy-visualization-msgs ros-jazzy-ros-gz-interfaces
      - name: Build
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ros2_ws && colcon build --symlink-install
      - name: Test
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ros2_ws && . install/setup.sh && colcon test && colcon test-result --verbose
