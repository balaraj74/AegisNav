[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["ros2_ws/src/aegisnav_core/test", "ros2_ws/src/aegisnav_ros/test"]
pythonpath = ["ros2_ws/src/aegisnav_core", "ros2_ws/src/aegisnav_ros"]
